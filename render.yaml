# Render Blueprint — deploys unokuet as a long-running Web Service.
# Docs: https://render.com/docs/blueprint-spec
# Dashboard: New > Blueprint, point at this repo (reads render.yaml automatically).
#
# NOTE: do NOT set NODE_ENV=production here — that would make `npm ci` skip
# devDependencies during the build and break the Tailwind/TypeScript build.
# Render sets NODE_ENV=production automatically at runtime.

services:
  - type: web
    name: unokuet
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3000
