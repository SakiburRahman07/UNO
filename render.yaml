# Render Blueprint — deploys unokuet as a long-running Web Service.
# Docs: https://render.com/docs/blueprint-spec
# Dashboard: New > Blueprint, point at this repo (reads render.yaml automatically).
#
# NOTE: do NOT set NODE_ENV or PORT here.
# - NODE_ENV=production during build would skip devDependencies (breaks build).
# - PORT is auto-injected by Render; overriding it can cause a 502.
# Render sets both automatically at runtime.

services:
  - type: web
    name: unokuet
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
